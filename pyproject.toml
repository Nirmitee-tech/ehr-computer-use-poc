[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclerk-desktop"
version = "0.1.0"
description = "A local, reviewable desktop computer-use engine"
requires-python = ">=3.9"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
linux = ["python-xlib>=0.33", "mss>=9"]

[project.scripts]
openclerk = "openclerk.cli:main"

[tool.setuptools.package-data]
openclerk = ["web/*"]

[tool.setuptools.packages.find]
include = ["openclerk*"]
